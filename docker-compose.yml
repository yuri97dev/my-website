services:
  web:
    image: nginx:alpine
    container_name: my-website-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1/fpm-ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  postgres:
    image: pgvector/pgvector:pg18
    container_name: my-website-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:8-alpine
    container_name: my-website-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  ollama-server:
    image: ollama/ollama:0.40.6
    container_name: my-website-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
      - ./storage/ai_models:/models/ai:ro
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    environment:
      - "OLLAMA_HOST=0.0.0.0:11434"
      - "OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-5m}"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  laya:
    build:
      context: ./docker/laya
      args:
        TORCH_INDEX: cpu
        TORCH_VERSION: "2.14.0"
    container_name: my-website-laya
    restart: unless-stopped
    init: true
    command: ["laya-serve"]
    environment:
      LAYA_HOST: "0.0.0.0"
      LAYA_PORT: "8000"
      LAYA_DEVICE: cpu
      LAYA_PRELOAD: "1"
      LAYA_MODELS: multilingual
      LAYA_DEFAULT_MODEL: multilingual
      LAYA_MAX_LOADED: "1"
      LAYA_THREADS: "2"
      OMP_NUM_THREADS: "2"
      LAYA_API_KEY: ${LAYA_API_KEY:?LAYA_API_KEY must be set}
    volumes:
      - laya_models:/home/laya/.cache/huggingface
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10m

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
    container_name: my-website
    restart: unless-stopped
    volumes:
      - .:/var/www/html
    env_file:
      - .env
    user: "${USER_ID:-1000}:${GROUP_ID:-1000}"
    environment:
      DB_HOST: "postgres"
      REDIS_HOST: "redis"
      HOME: /tmp
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);'"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
    container_name: my-website-worker
    restart: unless-stopped
    command: ["supervisord", "-c", "/etc/supervisor/supervisord.conf"]
    volumes:
      - .:/var/www/html
      - ./docker/supervisor/supervisord.conf:/etc/supervisor/supervisord.conf:ro
    env_file:
      - .env
    user: "${USER_ID:-1000}:${GROUP_ID:-1000}"
    environment:
      DB_HOST: "postgres"
      REDIS_HOST: "redis"
      HOME: /tmp
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama-server:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  ollama_data:
  laya_models:

networks:
  default:
    name: ${DOCKER_NETWORK:-my-website-internal}
