[supervisord]
nodaemon=true
loglevel=info
logfile=/var/www/html/storage/logs/supervisord.log
pidfile=/tmp/supervisord.pid
childlogdir=/var/www/html/storage/logs

[program:scheduler]
process_name=%(program_name)s
command=php /var/www/html/artisan schedule:work
autostart=true
autorestart=true
stderr_logfile=/var/www/html/storage/logs/scheduler-error.log
stdout_logfile=/var/www/html/storage/logs/scheduler-output.log
priority=2
numprocs=1

[program:worker-emails]
process_name=%(program_name)s_%(process_num)s
command=php /var/www/html/artisan queue:work database --queue=emails --sleep=3 --tries=3 --timeout=120 --max-time=3600
autostart=true
autorestart=true
stopwaitsecs=130
stderr_logfile=/var/www/html/storage/logs/worker-emails-error.log
stdout_logfile=/var/www/html/storage/logs/worker-emails-output.log
priority=1
numprocs=1

[program:worker-spreadsheets]
process_name=%(program_name)s_%(process_num)s
command=php /var/www/html/artisan queue:work database --queue=spreadsheets --sleep=3 --tries=3 --timeout=120 --max-time=3600
autostart=true
autorestart=true
stopwaitsecs=130
stderr_logfile=/var/www/html/storage/logs/worker-spreadsheets-error.log
stdout_logfile=/var/www/html/storage/logs/worker-spreadsheets-output.log
priority=1
numprocs=2

[program:worker-scraping]
