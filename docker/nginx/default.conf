server {
    listen 80;
    server_name _;

    client_max_body_size 100M;

    root /var/www/html/public;
    index index.php;

    # Docker's embedded DNS. Required because the upstream below is a variable,
    # which makes nginx resolve "app" per request instead of caching the address
    # it saw at startup. Without this, nginx keeps talking to the IP the app
    # container had before it was recreated by `up --build`, returning 502.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        set $fpm_upstream app:9000;
        fastcgi_pass $fpm_upstream;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
    }

    # php-fpm's built-in ping, used by the container healthcheck to assert the
    # nginx -> php-fpm hop works. Reachable only from inside this container.
    location = /fpm-ping {
        access_log off;
        allow 127.0.0.1;
        deny all;

        set $fpm_upstream app:9000;
        fastcgi_pass $fpm_upstream;
        fastcgi_param SCRIPT_NAME /ping;
        fastcgi_param SCRIPT_FILENAME /ping;
        fastcgi_param REQUEST_URI /ping;
        fastcgi_param DOCUMENT_URI /ping;
        fastcgi_param REQUEST_METHOD $request_method;
        fastcgi_param QUERY_STRING "";
        fastcgi_param SERVER_PROTOCOL $server_protocol;
        fastcgi_param GATEWAY_INTERFACE CGI/1.1;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
